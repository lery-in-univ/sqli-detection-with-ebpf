[project]
name = "sqli-detection-with-ebpf"
version = "0.1.0"
description = "SQL Injection detection PoC with FastAPI, Random Forest, Qwen zero-shot verification, and eBPF/XDP blocking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "joblib>=1.4.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "uvicorn>=0.30.0",
]
